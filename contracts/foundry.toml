[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
# Treat all warnings as errors in CI; relax locally if needed.
deny_warnings = false
fs_permissions = [{ access = "read-write", path = "./out" }, { access = "read-write", path = "../deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
sepolia          = "${SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421_614 }
sepolia          = { key = "${ETHERSCAN_API_KEY}", chain = 11_155_111 }
